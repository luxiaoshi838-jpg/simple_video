name: Apply v1.0.8 source patch

on:
  push:
    branches:
      - agent/v1.0.8-centered-logo-controls
    paths:
      - tools/v108-controls.patch

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.head_commit.message == 'Trigger v1.0.8 source patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1.0.8-centered-logo-controls
          fetch-depth: 0

      - name: Apply source patch
        run: |
          git apply --check tools/v108-controls.patch
          git apply tools/v108-controls.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luxiaoshi/jianbo/player/PlayerScreen.kt
          git commit -m "修复控制栏5秒隐藏与中心暂停范围"
          git push origin HEAD:agent/v1.0.8-centered-logo-controls
