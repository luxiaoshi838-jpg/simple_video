name: Android release build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and API 36
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-commandline.zip
          rm -rf /tmp/android-commandline
          mkdir -p /tmp/android-commandline
          unzip -q /tmp/android-commandline.zip -d /tmp/android-commandline
          mv /tmp/android-commandline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Debug and Release unit tests
        run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release package and version
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
            echo "$badging" | grep -q "package: name='com.luxiaoshi.jianbo'"
            echo "$badging" | grep -q "versionCode='14'"
            echo "$badging" | grep -q "versionName='1.0.13'"
          done

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: jianbo-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
