name: Android build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Package Android signing tools
        run: |
          mkdir -p apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" apksigner-tool/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" apksigner-tool/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner-tool/lib/
          chmod +x apksigner-tool/apksigner apksigner-tool/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apksigner-tool
          if-no-files-found: error

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug and unsigned release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jianbo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: jianbo-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
